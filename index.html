<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Zones</title>
<meta name="description" content="Compare time zones and convert any time between them.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-64.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Zones">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #000000; --muted: #6d6d72; --line: #e3e3e8;
  --accent: #007aff; --orange: #d9650a; --red: #ff3b30; --field: #e9e9ee; --shade: rgba(0,0,0,.35);
  --green: #1e9e4a; --sun: #f0a400; --dusk: #e07b39; --night: #6b70a8; --anchor: #eaf2ff;
  --daybar: linear-gradient(90deg, #27305e 0%, #27305e 20%, #f0a35a 29%, #ffd76a 38%, #ffe58a 50%, #ffd76a 66%, #f0a35a 77%, #27305e 90%, #27305e 100%);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --text: #ffffff; --muted: #98989f; --line: #38383a;
    --accent: #0a84ff; --orange: #ff9f0a; --red: #ff453a; --field: #2c2c2e; --shade: rgba(0,0,0,.6);
    --green: #30d158; --sun: #ffd24a; --dusk: #ff9a5c; --night: #9aa0d6; --anchor: #14233b;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
#app {
  max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px)
           calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px);
}
h1 { font-size: 24px; font-weight: 700; margin: 2px 4px 8px; letter-spacing: -.3px; }
.card { background: var(--card); border-radius: 18px; overflow: hidden; }
.card + .card { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 7px 14px; }
.row .grow { flex: 1; min-width: 0; }
.link { border: 0; background: none; color: var(--accent); padding: 0; text-align: left; }

/* Time picker card */
.picker { padding: 10px 14px 8px; }
.pickhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.datestep { display: flex; align-items: center; gap: 2px; position: relative; }
.step { border: 0; background: var(--field); width: 32px; height: 32px; border-radius: 16px; font-size: 19px; line-height: 1; padding: 0 0 2px; }
.date { border: 0; background: none; font-size: 18px; font-weight: 700; padding: 0 6px; min-height: 32px; }
#dateInput { position: absolute; left: 40px; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
.now { border: 0; background: var(--accent); color: #fff; height: 32px; border-radius: 16px; padding: 0 14px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.now.live { background: var(--field); color: var(--green); }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 6px 0 0; background: transparent; touch-action: pan-y; display: block; }
.slider::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: var(--daybar); }
.slider::-moz-range-track { height: 12px; border-radius: 6px; background: var(--daybar); }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; border-radius: 15px; margin-top: -9px;
  background: #fff; border: 0; box-shadow: 0 1px 5px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.12);
}
.slider::-moz-range-thumb { width: 30px; height: 30px; border-radius: 15px; background: #fff; border: 0; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
.slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.caption { color: var(--muted); font-size: 12px; text-align: center; margin-top: 4px; }

/* Zone list */
.swipe { position: relative; overflow: hidden; touch-action: pan-y; }
.swipe + .swipe, .swipe + .add { border-top: 1px solid var(--line); }
.zone { position: relative; z-index: 1; background: var(--card); cursor: pointer; user-select: none; -webkit-user-select: none; }
.zone.anchor { background: var(--anchor); }
.zone .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone .sub { color: var(--muted); font-size: 13px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone .right { text-align: right; white-space: nowrap; flex: none; }
.zone .time { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.zone button.time { border: 0; background: none; padding: 0; display: block; margin-left: auto; }
.zone .timein {
  -webkit-appearance: none; appearance: none; display: block; margin-left: auto; border: 0; border-radius: 9px;
  background: var(--card); color: var(--accent); padding: 0 8px; height: 28px; min-width: 92px; text-align: right;
  box-shadow: 0 0 0 1.5px var(--accent);
}
.zone .day { color: var(--muted); font-size: 13px; margin-top: 1px; }
.zone .day.shift { color: var(--orange); }
.part { width: 20px; height: 20px; flex: none; display: inline-flex; }
.part svg { width: 100%; height: 100%; }
.part.work { color: var(--sun); }
.part.edge { color: var(--dusk); }
.part.night { color: var(--night); }
.actions { position: absolute; top: 0; right: 0; bottom: 0; width: 176px; display: flex; visibility: hidden; }
.swipe.open .actions, .swipe.dragging .actions { visibility: visible; }
.act { flex: 1; border: 0; background: var(--field); font-size: 15px; padding: 0; }
.act + .act { border-left: 1px solid var(--line); }
.act:disabled { color: var(--muted); opacity: .45; }
.act.danger { flex: 1.5; background: var(--red); color: #fff; font-weight: 600; border-left: 0; }
.add { color: var(--accent); width: 100%; min-height: 46px; padding: 7px 14px; }
.add .plus { background: var(--accent); color: #fff; width: 22px; height: 22px; border-radius: 11px;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }

.share { display: block; width: 100%; border: 0; background: var(--accent); color: #fff; height: 46px; border-radius: 23px; font-weight: 600; margin-top: 12px; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 8px 0; }
.foot .link { font-size: 13px; }
.hint { background: var(--card); border-radius: 16px; padding: 10px 12px; margin-top: 14px; font-size: 14px;
  color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
.hint .grow { flex: 1; }
.hint b { color: var(--text); }
.hint button { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 2px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 20px; font-size: 15px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast, .zone { transition: none !important; } }

/* Add sheet */
.pill { border: 0; background: var(--card); border-radius: 20px; height: 40px; padding: 0 16px; font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.shade { position: fixed; inset: 0; background: var(--shade); display: none; z-index: 10; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 12px);
  max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0;
  display: none; flex-direction: column; z-index: 11;
}
body.sheet-open { overflow: hidden; }
body.sheet-open .shade { display: block; }
body.sheet-open .sheet { display: flex; }
.sheet header { display: flex; align-items: center; padding: 12px 14px 10px; }
.sheet header b { flex: 1; text-align: center; margin-right: 76px; }
.search { margin: 0 14px 8px; }
.search input { width: 100%; border: 0; background: var(--card); height: 42px; border-radius: 21px; padding: 0 16px; font-size: 16px; }
.results { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 14px calc(env(safe-area-inset-bottom) + 24px); flex: 1; }
.label { color: var(--muted); font-weight: 600; font-size: 14px; margin: 14px 14px 6px; }
.pick { width: 100%; border: 0; background: none; text-align: left; }
.pick + .pick { border-top: 1px solid var(--line); }
.pick:disabled { opacity: .45; }
.pick .sub { color: var(--muted); font-size: 13px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Add time zone or city">
  <header><button class="pill" id="cancel">Cancel</button><b>Add</b></header>
  <div class="search">
    <input id="q" type="search" placeholder="City or time zone, e.g. Miami or ET"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
  </div>
  <div class="results" id="results"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
